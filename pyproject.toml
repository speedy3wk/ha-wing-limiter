[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
include = ["custom_components/wing_limiter"]
pythonVersion = "3.14"
# HA intentionally mixes property and cached_property descriptors in entity bases.
reportIncompatibleVariableOverride = false

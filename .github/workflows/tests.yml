name: Tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ha: ["stable", "2026.11.0b2", "dev"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - name: Install beta or development Home Assistant
        if: matrix.ha != 'stable'
        env:
          HA_REF: ${{ matrix.ha }}
        run: |
          for attempt in 1 2 3; do
            if pip install "homeassistant @ https://github.com/home-assistant/core/archive/${HA_REF}.tar.gz"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep "$((attempt * 15))"
            fi
          done
          exit 1
      - run: ruff check custom_components tests
      - run: ruff format --check custom_components tests
      - run: pyright --pythonpath "$(command -v python)"
      - run: python -m pytest -q
